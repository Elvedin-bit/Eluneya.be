# Netlify publiceert enkel de map site/ (src/ en supabase/ blijven buiten de website).
[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Webshop: een product dat net is toegevoegd heeft nog geen vaste pagina (die komt bij de volgende build).
# Bestaat /shop/<categorie>/<product>/ als bestand, dan wint dat bestand (geen "force"); anders toont
# Netlify de generieke productpagina, die het product live ophaalt.
[[redirects]]
  from = "/shop/:category/:product"
  to = "/shop/product.html"
  status = 200

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
